services:
  - type: web
    name: backend-dinkup
    runtime: node
    plan: starter
    region: singapore
    buildCommand: pnpm install --prod=false && pnpm exec prisma generate && pnpm build
    startCommand: pnpm exec prisma migrate deploy && pnpm start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
